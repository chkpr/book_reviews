
@if (book) {
<div class = "container">
  <div class="book">
    <img [src]="book.coverUrl" [alt]="book.title">
    <h2>{{ book.title }}</h2>
    <p class="author">{{ book.author.firstname }} {{ book.author.name }}</p>
    <p class="published">{{ book.publishedYear }}</p>
  </div>
  <div class="review">
    <p class="description">{{ book.summary }}</p>
    <a routerLink="/books">Retour à la liste</a>
  </div>
</div>
}

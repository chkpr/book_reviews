<div class = "container">
  <div class="book">
    <img [src]="image" [alt]="title">
    <h2>{{ title }}</h2>
    <p class="author">{{ author }}</p>
    <p class="publisher">{{ publisher }}, {{ publishing }}</p>
    <p class="description">{{ description }}</p>
    <p class="createdAt">Posté le {{ createdAt }}</p>
    <p (click)="onLike()"><button>🤟</button> {{ likes }}</p>
  </div>
</div>
